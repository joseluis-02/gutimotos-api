<div x-show="isMeasureDetailModal" class="fixed inset-0 flex items-center justify-center p-5 overflow-y-auto z-99999">
  <div class="modal-close-btn fixed inset-0 h-full w-full bg-gray-400/50 backdrop-blur-[32px]">
  </div>
  <div 
    @click.outside="isMeasureDetailModal = false"
    class="no-scrollbar relative w-full max-w-[700px] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11">
    <!-- close btn -->
    <button
      @click="isMeasureDetailModal = false"
      class="transition-color absolute right-5 top-5 z-999 flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 dark:bg-gray-700 dark:text-gray-400 dark:hover:bg-white/[0.07] dark:hover:text-gray-300">
      <svg
        class="fill-current"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
          fill=""/>
      </svg>
    </button>
    <!-- ====== Table Six Start -->
    <div id="measure-detail-modal" class="flex flex-col gap-6 lg:flex-row lg:items-start lg:justify-between">
       <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-7 2xl:gap-x-32">
         <div>
           <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
             ID
           </p>
           <p class="text-sm font-medium text-gray-800 dark:text-white/90">
             {{ obj.id|default:"" }}
           </p>
         </div>

         <div>
           <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
             Código SIN
           </p>
           <p class="text-sm font-medium text-gray-800 dark:text-white/90">
            {{ obj.code_sin|default:"" }}
           </p>
         </div>

         <div>
           <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
             Abreviatura
           </p>
           <p class="text-sm font-medium text-gray-800 dark:text-white/90">
             {{ obj.short_name|default:"" }}
           </p>
         </div>

         <div>
           <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
               Estado
           </p>
           <p class="text-sm font-medium text-gray-800 dark:text-white/90">
              {{ obj.is_active|yesno:"Activo,Inactivo" }}
           </p>
         </div>

         <div>
           <p class="mb-2 text-xs leading-normal text-gray-500 dark:text-gray-400">
               Descripción
           </p>
           <p class="text-sm font-medium text-gray-800 dark:text-white/90">
               {{ obj.name|default:"" }}
           </p>
         </div>

       </div>
    </div>
     <!-- ====== Table Six End -->
  </div>
</div>
