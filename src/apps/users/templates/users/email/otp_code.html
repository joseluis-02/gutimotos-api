<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de verificación</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff;">
    
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center" style="padding: 50px 20px;">
                
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px;">
                    
                    <tr>
                        <td style="padding-bottom: 30px;">
                            <h1 style="margin: 0; color: #1c1e21; font-size: 20px; font-weight: 600;">
                                Usa este código para verificar tu identidad en {{ company_name }}
                            </h1>
                        </td>
                    </tr>
                    
                    <tr>
                        <td style="padding-bottom: 25px;">
                            <div style="background-color: #f2f3f5; padding: 15px; text-align: center;">
                                <span style="font-size: 32px; font-weight: 700; color: #1c1e21; letter-spacing: 6px; font-family: 'Courier New', monospace;">
                                    {{ otp_code }}
                                </span>
                            </div>
                        </td>
                    </tr>
                    
                    <tr>
                        <td style="padding-bottom: 20px;">
                            <p style="margin: 0; color: #606770; font-size: 14px;">
                                El código es válido durante {{ validity_minutes }} minutos.
                            </p>
                        </td>
                    </tr>
                    
                    <tr>
                        <td style="padding-bottom: 30px;">
                            <p style="margin: 0; color: #8a8d91; font-size: 13px; line-height: 1.4;">
                                Si no solicitaste este código, ignora este correo.
                            </p>
                        </td>
                    </tr>
                    
                    <tr>
                        <td style="padding: 30px 0; border-top: 1px solid #e4e6eb;">
                            <p style="margin: 0; color: #8a8d91; font-size: 12px;">
                                {{ company_name }} • {{ current_year }}
                            </p>
                        </td>
                    </tr>
                    
                </table>
                
            </td>
        </tr>
    </table>
    
</body>
</html>
