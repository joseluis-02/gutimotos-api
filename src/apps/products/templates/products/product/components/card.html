<!-- Card -->
  <div class="card bg-base-100 shadow hover:shadow-lg transition duration-300">
    <figure class="aspect-[4/3]">
      <img
        src="{{ product.get_photo_url }}"
        alt="{{ product.code }}"
        loading="lazy"
        class="w-full h-full object-cover rounded-t-lg" />
    </figure>
    <div class="card-body">
      <h2 class="card-title text-lg font-semibold">
        {{ product.code }}
        <div class="badge badge-secondary">Bs. {{ product.get_price_public|floatformat:2 }}</div>
      </h2>
      <p class="text-gray-600 text-sm">
        {{ product.description }}
      </p>
    </div>
  </div>
  <!-- Fin Card -->
