{# customers/templates/customers/create.html #}
{% extends "admin/layout/base.html" %}
{% load static %}
{% block title %}Tabla de productos{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/libraries/tabulator.min.css' %}">
{% endblock %}


{% block content %}
<div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-4 sm:mb-6 mb-4">
  
  <!-- Select con ancho fijo en sm+ -->
  <select class="select select-bordered w-full sm:w-[15%]">
    <option disabled selected>Categoría</option>
    <option>Categoria 1</option>
    <option>Categoria 2</option>
    <option>Categoria 3</option>
  </select>
  <!-- Select con ancho fijo en sm+ -->
  <select class="select select-bordered w-full sm:w-[15%]">
    <option disabled selected>Marca</option>
    <option>Categoria 1</option>
    <option>Categoria 2</option>
    <option>Categoria 3</option>
  </select>
  <!-- Input de búsqueda -->
  <label class="input w-full sm:flex-1">
    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </g>
    </svg>
    <input type="search" id="search-input" required placeholder="Buscar" class="w-full" />
  </label>

  <!-- Botón con ancho fijo en sm+ -->
  <!--<button class="btn btn-soft w-full sm:w-[15%]">Agregar</button>-->
</div>


<div id="product-tabulator" class="overflow-x-auto">
</div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'js/libraries/tabulator.min.js' %}"></script>
  <script src="{% static 'js/libraries/tabulator-es.js' %}"></script>
  <script>
    const searchInput = document.getElementById("search-input");
    const BASE_URL = "{{ request.scheme }}://{{ request.get_host }}";
    const table = new Tabulator("#product-tabulator", {
    ajaxURL: BASE_URL+'/products/api/product/tabulator',
    ajaxConfig: { method: "GET" },

    // 📦 Datos remotos con paginación
    pagination: true,
    paginationSize: 5,
    //paginationSizeSelector: [5, 10, 25, 50, 100],
    paginationMode: "remote", // oculta la paginación por defecto

    responsiveLayout: "collapse",          // activa modo responsive con collapse
    responsiveLayoutCollapseStartOpen: true,

    //paginationButtonCount: 0, // Evita botones de número de página

    // 🧭 Mapea la respuesta de tu backend
    dataReceiveParams: {
      last_page: "max_pages", // <- necesario para que Tabulator no dé error
    },

    ajaxURLGenerator:function(url, config, params){
        return url + "?params=" + encodeURI(JSON.stringify(params)); //encode parameters as a json object
    },

    // 🧠 Filtro personalizado desde un input externo
    ajaxRequestFunc: function (url, config, params) {
      const searchInput = document.getElementById("search-input");
      const searchVal = searchInput ? searchInput.value : "";

      const query = new URLSearchParams({
        page: params.page,
        size: params.size,
        type_price_slug: 'venta-publico',
        currency_code:'BOB',
        sort: params.sorters?.[0]?.field || "code",
        dir: params.sorters?.[0]?.dir || "asc",
        search: searchVal,
      });

      return fetch(`${url}?${query}`, config).then((res) => res.json());
    },

    ajaxResponse: function (url, params, response) {
      return response; 
    },

    // 🧱 Diseño de columnas
    layout: "fitDataFill",
    resizableColumnFit: true,
    responsiveLayout: "collapse",
    rowHeader: {
      formatter: "responsiveCollapse",
      width: 30,
      hozAlign: "center",
      headerSort: false,
      resizable: false,
    },

    // 📭 Placeholder para vacíos
    placeholder: "No hay datos disponibles",
    placeholderHeaderFilter: "No hay filtros disponibles",
    columns: [
      { title: "Código", field: "code", sorter: "string", responsive:0 },
      { title: "Marca", field: "brand_name", responsive:1},
      { title: "Categoría", field: "category", responsive:2},
      { title: "Descripción", field: "description", sorter: "string", responsive:3},
      { title: "Precio venta", field: "price", responsive:3 },
      { title: "Moneda", field: "currency", responsive:3},
      /*{
          title: "Acciones",
          field: "acciones",
          hozAlign: "center",
          responsive: false, // Prioridad máxima
          headerSort: false,
          formatter: function(cell, formatterParams) {
              const id = cell.getRow().getData().id;
              return `
                  <button class="btn btn-xs btn-square">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" lass="size-4" stroke="currentColor" class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                  </button>
                  <button class="btn btn-xs btn-square">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" lass="size-4" stroke="currentColor" class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                  </button>
              `;
          },
          width: 150,
          hozAlign: "center"
      },*/
    ],
  });

  table.on("tableBuilt", function () {
    const pageSizeSelector = document.querySelector(".tabulator-pages");
    if (pageSizeSelector) {
      pageSizeSelector.remove(); // Elimina el <select> de cantidad de ítems por página
    }

    const paginator = document.querySelector(".tabulator-paginator");
    if (!paginator) return;

    paginator.classList.add(
      "flex", "justify-center"
      //"join","grid", "grid-cols-2", "mt-2", "mb-2"
      //"flex", "flex-wrap", "justify-center", "gap-2", "text-sm", "mt-2", "mb-2"
    );

    // Elimina botones "first" y "last"
    paginator.querySelectorAll("button").forEach((btn) => {
      const pageType = btn.dataset.page;
      if (pageType === "first" || pageType === "last") {
        btn.remove();
      }
    });

    // Aplicar estilos a los botones restantes y desactivar según la página actual
    const currentPage = table.getPage(); // número de página actual
    const maxPage = table.getPageMax();  // total de páginas

    paginator.querySelectorAll("button").forEach((btn) => {
      const pageType = btn.dataset.page;

      btn.className = "";
      btn.classList.add("btn", "btn-soft", "btn-sm", "m-1");

      // Deshabilitar si corresponde
      if (pageType === "prev") {
        btn.disabled = currentPage === 1;
      } else if (pageType === "next") {
        btn.disabled = currentPage === maxPage;
      }
    });
  });

  function debounce(func, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }

  searchInput.addEventListener("input", debounce(() => {
      table.setPage(1);     // vuelve a la página 1 cuando buscas
      table.redraw(true);   // fuerza la recarga de datos
  }, 400)); // 300ms de espera después de dejar de escribir


  </script>
{% endblock %}
