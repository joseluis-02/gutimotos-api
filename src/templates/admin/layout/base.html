{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="business">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Somos una concesionaria de motos con las mejores marcas y modelos del mercado.">
	<meta name="author" content="Gutisoft - gutisoft.dev@gmail.com">
	<meta name="keywords" content="Gutimotos, Panel de administración Gutimotos, admin gutimotos,repuestos de motos, accesorios de motos, venta de motos, concesionaria de motos">
  <link rel="shortcut icon" href="{% static 'images/favicon.ico'%}" />
  <title>
        {% block title %}{% endblock %}
  </title>
  <!-- Estilos generales -->
  <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">
  <!-- Estilos personalizados por página -->
  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Navbar -->
  {% include "admin/partials/navbar.html" %}
  <!-- ===== Main Content Start ===== -->
    <main>
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <!-- Your content -->
        {% block content %}
        {% endblock %}
      </div>
    </main>
  <!-- ===== Main Content End ===== -->
  
  <!-- Scripts personalizados por página -->
  {% block extra_js %}
  {% endblock %}
</body>
</html>
