{% load static %}
<div class="navbar bg-base-200 shadow-sm">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /> </svg>
      </div>
      <ul
        tabindex="0"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
        {#<li><a href="{% url 'products:products_web:web_product:product_tabulator'%}">Tabla</a></li>#}
        <li><a href="{% url 'products:products_web:web_product:product_catalog'%}">Catálogo repuestos</a></li>
      </ul>
    </div>
  </div>
  <div class="navbar-center">
    <a href="{% url 'dashboard:index' %}" class="btn btn-ghost text-xl">Gutimotos</a>
  </div>
  <div class="navbar-end">

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
        <div class="w-10 rounded-full">
          <img
            alt="User"
            src="{% static 'images/user.jpg' %}" />
        </div>
      </div>
      {% if user.is_authenticated %}
        <ul
          tabindex="0"
          class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
          
          {% if user.is_authenticated and user.is_staff %}
            <li>
              <a href="{% url 'admin:index' %}">Administrar</a>
            </li>
          {% endif %}
            <li>
              <a href="{% url 'users:users_web:web_auth:auth_logout' %}">
                Cerrar sesión
              </a>
            </li>
        </ul>
      {% endif %}
    </div>

  </div>
</div>
