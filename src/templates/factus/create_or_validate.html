<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.0/css/dataTables.dataTables.min.css" />
    <title>Hello, world!</title>
  </head>
  <body>

    <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">

    <!-- Main content -->
    <div class="content mt-4">
      <div class="container-fluid mt-4">


        <div class="panel-body" id="formularioregistros">
           <form name="formulario" id="formulario" method="post">{% csrf_token %}
              <div class="form-group col-lg-4 col-md-4 col-sm-4 col-xs-12">
                <label>Fecha de vencimiento(*):</label>
                <input type="datetime-local" class="form-control" name="fecha_hora" id="fecha_hora" required="">
              </div>

              <div class="form-group col-lg-6 col-md-6 col-sm-6 col-xs-12">
                <label>Rango de numeración (*):</label>
                <select name="tipo_comprobante" id="tipo_comprobante" class="form-control selectpicker" required="">
                    <option value="8">Factura</option>
                    <option value="9">Nota de crédito</option>
                    <option value="10">Nota débito</option>
                </select>
              </div>

              <div class="form-group col-lg-8 col-md-8 col-sm-8 col-xs-12">
                <label>Cliente(*):</label>
                <input type="hidden" name="idventa" id="idventa">
                <select id="idcliente" name="idcliente" class="form-control selectpicker" data-live-search="true" required>
                  
                </select>
              </div>
              
              <div class="form-group col-lg-3 col-md-3 col-sm-6 col-xs-12">
                <a data-toggle="modal" href="#myModal">           
                  <button id="btnAgregarArt" type="button" class="btn btn-primary"> <span class="fa fa-plus"></span> Agregar Artículos</button>
                </a>
              </div>

              <div class="col-lg-12 col-sm-12 col-md-12 col-xs-12">
                <table id="detalles" class="table table-striped table-bordered nowrap table-responsive-sm" style="width:100%">
                  <thead style="background-color:#A9D0F5">
                        <th>Opciones</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Venta</th>
                        <th>Descuento</th>
                        <th>Subtotal</th>
                    </thead>
                    <tfoot>
                        <th>TOTAL</th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th><h4 id="total">BS/. 0.00</h4><input type="hidden" name="total_venta" id="total_venta"></th> 
                    </tfoot>
                    <tbody>
                      
                    </tbody>
                </table>
              </div>
              <div class="form-group mt-4 mb-4">
                <label for="exampleFormControlTextarea1">Observaciones(opcional) </label>
                <textarea class="form-control" id="observation" name="observation" rows="3"></textarea>
              </div>

              <div class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <button class="btn btn-secondary" id="btnValidar">Validar</button>
                <button class="btn btn-primary" type="submit" id="btnGuardar">Facturar</button>

              </div>
            </form>
        </div>


      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->


  <div class="modal fade" id="myModal" data-backdrop="static" data-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
                <table id="tblarticulos" class="table table-striped table-bordered nowrap" style="width:100%">
                    <thead>
                        
                        <th>Código</th>
                        <th>Título</th>
                        <th>Precio Venta</th>
                        <th>Opciones</th>
                    </thead>
                  <tbody>                            
                  </tbody>
                  <!-- <tfoot>
                  </tfoot>-->
                </table>
            </div>
          </div>
          <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
      </div>
      <!-- /.modal -->
    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.2.0/js/dataTables.min.js" ></script>
    <script>


        var tabla;

        //Función que se ejecuta al inicio
        function init(){
        document.getElementById('formulario').addEventListener('submit', async function (event) {
            event.preventDefault(); // Evitar que el formulario se envíe de manera tradicional
            console.log('Inicia el proceso de validar y crear factura...');
            // Crear un objeto FormData con los datos del formulario
            const formData = new FormData(this);
    
            try {
                // Hacer la solicitud POST con fetch
                const response = await fetch("{% url 'create-validate' %}", {
                    method: 'POST',
                    body: formData,  // Enviar los datos del formulario
                });
    
                // Verificar si la solicitud fue exitosa
                if (!response.ok) {
                    throw new Error('Error en la solicitud');
                }
    
                // Obtener la respuesta JSON del servidor
                const data = await response.json();
    
                // Si la respuesta indica éxito
                if (data.status === "success") {
                    alert(data.message); // Muestra el mensaje de éxito
                    console.log(data.invoice)
                    // Puedes hacer otras acciones aquí, como limpiar el formulario
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un problema con el envío del formulario.');
            }
        });

        // URL del endpoint
        const endpoint = '/customers/';

        // Obtener los datos desde el endpoint
        fetch(endpoint)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al obtener los datos');
                }
                return response.json();
            })
            .then(data => {
                
                const customerSelect = document.getElementById('idcliente');
                data.forEach(customer => {
                    // console.log(customer);
                    // Crear un elemento <option> para cada cliente
                    const option = document.createElement('option');
                    option.value = customer.identification; // Usar el ID como valor
                    option.textContent = `${customer.names} (${customer.email})`; // Mostrar el nombre y el correo
                    customerSelect.appendChild(option);
                });
                console.log('Cargado los clientes exitosamente');
            })
            .catch(error => {
                console.error('Error:', error);
            });
            listarArticulos();
        }
        
        //Función ListarArticulos
        function listarArticulos(){
        // URL del endpoint
        console.log('Cargando la lista de productos');
        const endpoint = '/items/';

            // Obtener los datos del endpoint
            fetch(endpoint)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al obtener los datos');
                    }
                    return response.json();
                })
                .then(data => {
                    const tableBody = document.querySelector('#tblarticulos');
                    
                    // Iterar sobre los datos y agregar filas a la tabla
                    data.forEach(item => {

                        //console.log(item);

                        const row = document.createElement('tr');
                        //console.log(JSON.stringify(item));
                        data = JSON.stringify(item);

                        // Crear celdas para cada columna
                        row.innerHTML = `
                            <td>${item.code_reference}</td>
                            <td>${item.name}</td>
                            <td>${item.price}</td>
                            <td>  <button type="button" class="btn btn-sm btn-info" onclick="agregarDetalle({code_reference: ${item.code_reference}, name: '${item.name}', price: ${item.price}, stock: ${item.stock}})" >Seleccionar</button></td>
                        `;
                        
                        // Agregar la fila al cuerpo de la tabla
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
        //Declaración de variables necesarias para trabajar con las ventas y
        //sus detalles
        var impuesto=15;
        var cont=0;
        var detalles=0;
        function agregarDetalle( item  ){
            //console.log(item)
            const {code_reference,name,price,stock} = item;
            var cantidad=1;
            var descuento=0;
            
            if (code_reference!="")
            {
                
                var subtotal=(cantidad*price)-descuento;
                
                var fila=`
                    <tr class="filas" id="fila${cont}">
                        <td>
                            <button type="button" class="btn btn-sm btn-danger" onclick="eliminarDetalle(${cont})">Quitar</i></button> 
                            <button type="button" onclick="modificarSubototales()" class="btn btn-sm btn-info">Actualizar</button></td>
                        <td><input type="hidden" name="idarticulo[]" value="${code_reference}">${name}</td>
                        <td><input type="number" name="cantidad[]" id="cantidad[]" min="1" max="${stock}" value="${cantidad}"></td>
                        <td><input type="number" name="precio_venta[]" id="precio_venta[]" value="${price}" readonly ></td>
                        <td><input type="number" name="descuento[]" id="descuento[]" min="0" max="${price}" value="${descuento}"></td>
                        <td><span name="subtotal" id="subtotal${cont}">${subtotal}</span></td>
                    </tr>
                `;
                cont++;
                detalles=detalles+1;
                $('#detalles').append(fila);
                modificarSubototales();
            }
            else
            {
                alert("Error al ingresar el detalle, revisar los datos del artículo");
            }
        }

        function modificarSubototales(){
            var cant = document.getElementsByName("cantidad[]");
            var prec = document.getElementsByName("precio_venta[]");
            var desc = document.getElementsByName("descuento[]");
            var sub = document.getElementsByName("subtotal");

            for (var i = 0; i <cant.length; i++) {
                var inpC=cant[i];
                var inpP=prec[i];
                var inpS=sub[i];
                var inpD=desc[i];
                inpS.value=(inpC.value * inpP.value)-inpD.value;
                document.getElementsByName("subtotal")[i].innerHTML = inpS.value;
            }
            calcularTotales();

        }
        function calcularTotales(){
            var sub = document.getElementsByName("subtotal");
            var total = 0.0;

            for (var i = 0; i <sub.length; i++) {
                total += document.getElementsByName("subtotal")[i].value;
            }
            $("#total").html("Bs/. " + total);
            $("#total_venta").val(total);
            evaluar();
        }
        function evaluar(){
            if (detalles>0)
          {
            $("#btnGuardar").show();
          }
          else
          {
            $("#btnGuardar").hide(); 
            cont=0;
          }
        }
        function eliminarDetalle(indice){
            $("#fila" + indice).remove();
            calcularTotales();
            detalles=detalles-1;
            evaluar();
        }


        init();
    </script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>

  </body>
</html>
