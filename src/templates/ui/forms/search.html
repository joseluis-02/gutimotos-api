
<form class="relative" @submit.prevent x-data="{ search: '{{ search|default:"" }}' }">
  <input
    type="text"
    x-model="search"
    x-ref="searchInput"
    id="search"
    name="search"
    placeholder="{{ placeholder|default:"Buscar" }}"
    hx-get="{{ hx_url }}"
    hx-trigger="keyup changed delay:400ms"
    hx-target="{{ hx_target }}"
    hx-push-url="false"
    autocomplete="off"
    class="w-full px-4 py-3 pl-4 pr-10 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100"
  />

  <!-- Botón para limpiar -->
  <div class="absolute right-3 top-3">
    <button
      type="button"
      hx-get="{{ hx_url }}"
      hx-target="{{ hx_target }}"
      hx-push-url="false"
      :disabled="search.length === 0"
      @click="
        search = '';
        $nextTick(() => {
          htmx.trigger($refs.searchInput, 'keyup');
          htmx.trigger($refs.searchInput, 'change');
          $refs.searchInput.focus();
        });
      "
      class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</form>
